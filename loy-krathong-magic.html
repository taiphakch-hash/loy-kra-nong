<div class="panel" id="panel"><select id="character"><option value="boy">👦 เด็กผู้ชาย</option><option value="girl">👧 เด็กผู้หญิง</option><option value="pair">👦👧 เด็กคู่</option></select><select id="krathong"><option value="🪷">🪷 กระทงดอกบัว</option><option value="🌸">🌸 กระทงดอกไม้</option><option value="🌼">🌼 กระทงดาวเรือง</option><option value="🕯️">🕯️ กระทงเทียน</option><option value="🍃">🍃 กระทงใบตอง</option><option value="✨">✨ กระทงแฟนตาซี</option></select><button id="float">🪷 ปล่อยกระทง</button><button id="fireworks">🎆 จุดพลุ</button><button id="music">🎵 เล่นเพลง</button><span id="trackName">ยังไม่ได้เลือกเพลง</span><button id="upload">📁 อัปโหลดเพลง</button><input id="file" type="file" accept="audio/*" hidden><button id="volume">🔊 เสียงเปิด</button><button id="density">✨ ความหนาแน่น: ปกติ</button><button id="fullscreen">⛶ เต็มหน้าจอ</button><button id="hide">👁 ซ่อนเมนู</button></div>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W,H,stars=[],snow=[],krathongs=[],particles=[];let selectedChar='boy',selectedKrathong='🪷',density=1,soundOn=true;let audio=new Audio();audio.loop=true;audio.volume=.5;let playing=false;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;initStars();initSnow()}addEventListener('resize',resize);
function initStars(){stars=Array.from({length:150},()=>({x:Math.random()*W,y:Math.random()*H*.55,a:Math.random()}))}
function initSnow(){snow=Array.from({length:Math.floor(W*H/6000*density)},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8+.5,v:Math.random()*1.2+.3}))}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#030615');g.addColorStop(.55,'#101b37');g.addColorStop(1,'#090d1b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function drawStars(){stars.forEach(s=>{s.a+=(Math.random()-.5)*.07;s.a=Math.max(.15,Math.min(1,s.a));ctx.fillStyle=`rgba(255,245,210,${s.a})`;ctx.font='12px serif';ctx.fillText(Math.random()>.7?'✦':'.',s.x,s.y)})}
function moon(){let x=W*.78,y=H*.19,r=Math.min(W,H)*.06;ctx.save();ctx.shadowBlur=35;ctx.shadowColor='#ffe9a3';ctx.fillStyle='#fff1bd';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function hills(){ctx.fillStyle='#111b30';ctx.beginPath();ctx.moveTo(0,H*.53);for(let x=0;x<=W;x+=45)ctx.lineTo(x,H*.52+Math.sin(x*.013)*32);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
function temple(){let x=W*.53,y=H*.57;ctx.textAlign='center';ctx.font=`${Math.max(10,12*density)}px monospace`;for(let row=0;row<13;row++){let yy=y-row*13,wide=(13-row)*11;for(let dx=-wide;dx<wide;dx+=13){ctx.fillStyle=row%3===0?'#e6ba67':'#c68c50';if(Math.random()>.35)ctx.fillText(row%2?'▲':'/',x+dx,yy)}}ctx.fillStyle='#ffe17e';ctx.font='22px serif';ctx.shadowBlur=12;ctx.shadowColor='#ffdb75';ctx.fillText('▲',x,y-185);ctx.shadowBlur=0}
function water(){let y=H*.59,g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'#14375c');g.addColorStop(1,'#030c20');ctx.fillStyle=g;ctx.fillRect(0,y,W,H-y);ctx.font=`${Math.max(9,12*density)}px monospace`;for(let yy=y+12;yy<H;yy+=18)for(let x=0;x<W;x+=24){ctx.fillStyle=Math.random()>.7?'rgba(255,221,143,.35)':'rgba(98,180,236,.18)';ctx.fillText(['~','≈','﹏','∿'][Math.floor(Math.random()*4)],x+Math.sin(x*.02+yy*.01)*4,yy)}}
function drawChar(x,y,type){ctx.font='40px serif';ctx.textAlign='center';ctx.fillText(type==='boy'?'👦':'👧',x,y)}function characters(){let y=H*.67,x=W*.19;if(selectedChar==='boy')drawChar(x,y,'boy');else if(selectedChar==='girl')drawChar(x,y,'girl');else{drawChar(x-27,y,'boy');drawChar(x+27,y,'girl')}}
function drawK(k){ctx.save();ctx.textAlign='center';ctx.font=`${28*k.scale}px serif`;ctx.shadowBlur=18;ctx.shadowColor='#ffd870';ctx.fillText(k.emoji,k.x,k.y);ctx.restore()}function spawnKrathong(x=W*.2,y=H*.76){krathongs.push({x,y,emoji:selectedKrathong,speed:.25+Math.random()*.5,phase:Math.random()*6,scale:.8+Math.random()*.45})}function floaters(){for(let i=krathongs.length-1;i>=0;i--){let k=krathongs[i];k.x+=k.speed;k.phase+=.03;k.y+=Math.sin(k.phase)*.22;drawK(k);if(k.x>W+60)krathongs.splice(i,1)}}
function firework(x=Math.random()*W,y=Math.random()*H*.45){const colors=['#ffdf77','#ff89ba','#82f6ff','#a5ff98','#fff'];for(let i=0;i<65;i++){let a=Math.random()*Math.PI*2,v=Math.random()*3.8+1;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:50+Math.random()*25,color:colors[Math.floor(Math.random()*colors.length)]})}}
function effects(){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.life--;ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life/70);ctx.fillText('✦',p.x,p.y);ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}snow.forEach(s=>{s.y+=s.v;s.x+=Math.sin(s.y*.012)*.25;if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.fillStyle='rgba(255,255,255,.75)';ctx.font=`${s.s+7}px monospace`;ctx.fillText(Math.random()>.5?'❄':'.',s.x,s.y)})}
function animate(){bg();drawStars();moon();hills();temple();water();characters();floaters();effects();requestAnimationFrame(animate)}resize();animate();
document.getElementById('character').onchange=e=>selectedChar=e.target.value;document.getElementById('krathong').onchange=e=>selectedKrathong=e.target.value;document.getElementById('float').onclick=()=>spawnKrathong();document.getElementById('fireworks').onclick=()=>firework();canvas.addEventListener('click',e=>{if(e.clientY>H*.58)spawnKrathong(e.clientX,e.clientY);else firework(e.clientX,e.clientY)});
document.getElementById('upload').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;audio.src=URL.createObjectURL(f);document.getElementById('trackName').textContent=f.name;audio.play().then(()=>{playing=true;document.getElementById('music').textContent='⏸ หยุดเพลง'}).catch(()=>{playing=false;document.getElementById('music').textContent='🎵 เล่นเพลง'})};document.getElementById('music').onclick=()=>{if(!audio.src){document.getElementById('file').click();return}if(playing){audio.pause();playing=false;document.getElementById('music').textContent='🎵 เล่นเพลง'}else{audio.play();playing=true;document.getElementById('music').textContent='⏸ หยุดเพลง'}};
document.getElementById('volume').onclick=()=>{soundOn=!soundOn;audio.muted=!soundOn;document.getElementById('volume').textContent=soundOn?'🔊 เสียงเปิด':'🔇 เสียงปิด'};document.getElementById('density').onclick=()=>{density=density%3+1;this.textContent=['✨ ความหนาแน่น: เบา','✨ ความหนาแน่น: ปานกลาง','✨ ความหนาแน่น: แน่น'][density-1];initSnow()};document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.getElementById('hide').onclick=()=>document.getElementById('panel').classList.toggle('hidden');
</script></body></html>
