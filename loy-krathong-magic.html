
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loy Krathong Magic</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #030610;
    color: white;
    font-family: "Consolas", monospace;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

.header {
    position: fixed;
    top: 12px;
    left: 12px;
    padding: 12px 18px;
    border-radius: 40px;
    background: rgba(10, 20, 40, .78);
    border: 1px solid rgba(255, 210, 100, .25);
    backdrop-filter: blur(12px);
    z-index: 5;
    font-family: Arial, sans-serif;
    font-weight: bold;
}

.header span {
    color: #ffd96a;
}

.panel {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: min(96%, 1000px);
    padding: 15px;
    background: rgba(20, 25, 45, .78);
    border: 1px solid rgba(255, 220, 120, .18);
    border-radius: 20px;
    backdrop-filter: blur(15px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 10;
}

button, select {
    border: 1px solid rgba(255, 220, 120, .3);
    border-radius: 12px;
    padding: 10px 13px;
    color: white;
    background: rgba(30, 40, 65, .85);
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}

button:hover {
    background: rgba(130, 95, 45, .5);
    transform: translateY(-2px);
}

button.active {
    border-color: #ffd45c;
    background: rgba(255, 190, 60, .2);
}

select option {
    background: #172033;
    color: white;
}

input[type="range"] {
    width: 85px;
    accent-color: #ffd45c;
}

.music-name {
    font-size: 12px;
    color: #ffd45c;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.hidden {
    display: none !important;
}

@media (max-width: 600px) {
    .panel {
        gap: 6px;
        padding: 10px;
        bottom: 8px;
    }

    button, select {
        padding: 8px;
        font-size: 11px;
    }

    .header {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="header">
    🪷 Loy Krathong Magic
    <span>4K Dense</span>
</div>

<div class="panel" id="panel">

    <select id="character">
        <option value="boy">👦 เด็กผู้ชาย</option>
        <option value="girl">👧 เด็กผู้หญิง</option>
        <option value="couple">👦👧 เด็กชายและเด็กหญิง</option>
    </select>

    <select id="krathong">
        <option value="🪷">🪷 กระทงดอกบัว</option>
        <option value="🌸">🌸 กระทงดอกไม้</option>
        <option value="🌼">🌼 กระทงดอกดาวเรือง</option>
        <option value="🕯️">🕯️ กระทงแสงเทียน</option>
        <option value="🍃">🍃 กระทงใบตอง</option>
        <option value="✨">✨ กระทงแฟนตาซี</option>
    </select>

    <button id="musicBtn">🎵 เล่นเพลง</button>

    <span class="music-name" id="musicName">
        ยังไม่ได้เลือกเพลง
    </span>

    <button id="uploadBtn">📁 อัปโหลดเพลง</button>

    <input type="file" id="musicFile" accept="audio/*" hidden>

    <button id="soundBtn">🔊 เสียงเปิด</button>

    <button id="floatBtn">🪷 ปล่อยกระทง</button>

    <button id="fireworkBtn">🎆 พลุ</button>

    <button id="densityBtn">✨ ความละเอียด</button>

    <button id="hideBtn">👁️ ซ่อนเมนู</button>

</div>

<script>
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

let W, H;

let character = "boy";
let krathong = "🪷";

let density = 1;
let soundEnabled = true;

let particles = [];
let floatingKrathongs = [];
let stars = [];

let audio = new Audio();
audio.loop = true;
audio.volume = 0.6;

let playing = false;

const symbols = ["*", "+", ".", "✦", "✧", "·", "°"];
const waterSymbols = ["~", "≈", "～", "﹏", "∿"];

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

    createStars();
}

window.addEventListener("resize", resize);

// ---------------- BACKGROUND ----------------

function background() {
    let grad = ctx.createLinearGradient(0, 0, 0, H);

    grad.addColorStop(0, "#020512");
    grad.addColorStop(.45, "#10142b");
    grad.addColorStop(.75, "#27203c");
    grad.addColorStop(1, "#070b19");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
}

// ---------------- MOON ----------------

function drawMoon() {
    let x = W * .78;
    let y = H * .18;
    let r = Math.min(W, H) * .07;

    ctx.save();

    ctx.shadowBlur = 45;
    ctx.shadowColor = "#ffe6a0";

    let moonGrad = ctx.createRadialGradient(
        x - r * .3, y - r * .3, r * .1,
        x, y, r
    );

    moonGrad.addColorStop(0, "#fffde8");
    moonGrad.addColorStop(1, "#ffe49a");

    ctx.fillStyle = moonGrad;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// ---------------- STARS ----------------

function createStars() {
    stars = [];

    for (let i = 0; i < 130; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H * .6,
            size: Math.random() * 2,
            alpha: Math.random()
        });
    }
}

function drawStars() {
    stars.forEach(star => {
        star.alpha += (Math.random() - .5) * .06;
        star.alpha = Math.max(.15, Math.min(1, star.alpha));

        ctx.fillStyle = `rgba(255,255,220,${star.alpha})`;
        ctx.font = `${star.size + 8}px monospace`;

        ctx.fillText(
            Math.random() > .5 ? "✦" : ".",
            star.x,
            star.y
        );
    });
}

// ---------------- TEMPLE ----------------

function drawTemple() {
    let baseY = H * .53;
    let center = W * .5;

    ctx.textAlign = "center";
    ctx.font = `${Math.max(10, 13 * density)}px monospace`;

    let rows = 13;

    for (let row = 0; row < rows; row++) {
        let y = baseY - row * 13;
        let width = (rows - row) * 11;

        for (let x = -width; x <= width; x += 13) {
            let px = center + x;

            ctx.fillStyle = row % 3 === 0
                ? "#e9b75d"
                : "#d28d4a";

            if (Math.random() > .3) {
                ctx.fillText(
                    row % 2 === 0 ? "/" : "▲",
                    px,
                    y
                );
            }
        }
    }

    // เจดีย์ยอด
    ctx.fillStyle = "#ffd76e";
    ctx.shadowBlur = 12;
    ctx.shadowColor = "#ffcf66";

    ctx.font = "20px monospace";
    ctx.fillText("▲", center, baseY - rows * 13 - 10);

    ctx.shadowBlur = 0;
}

// ---------------- WATER ----------------

function drawWater() {
    let waterY = H * .60;

    let grad = ctx.createLinearGradient(0, waterY, 0, H);

    grad.addColorStop(0, "#142f50");
    grad.addColorStop(.5, "#071b35");
    grad.addColorStop(1, "#020918");

    ctx.fillStyle = grad;
    ctx.fillRect(0, waterY, W, H - waterY);

    ctx.font = `${Math.max(9, 12 * density)}px monospace`;

    for (let y = waterY + 12; y < H; y += 18) {
        for (let x = 0; x < W; x += 20) {
            let offset = Math.sin(x * .02 + y * .02 + Date.now() * .001);
            let px = x + offset * 6;

            ctx.fillStyle = Math.random() > .7
                ? "rgba(255,220,140,.45)"
                : "rgba(90,170,230,.25)";

            ctx.fillText(
                waterSymbols[Math.floor(Math.random() * waterSymbols.length)],
                px,
                y
            );
        }
    }
}

// ---------------- CHARACTER ----------------

function drawBoy(x, y, scale = 1) {
    ctx.font = `${32 * scale}px serif`;
    ctx.textAlign = "center";

    ctx.fillText("👦", x, y);
}

function drawGirl(x, y, scale = 1) {
    ctx.font = `${32 * scale}px serif`;
    ctx.textAlign = "center";

    ctx.fillText("👧", x, y);
}

function drawCharacters() {
    let y = H * .64;
    let x = W * .2;

    if (character === "boy") {
        drawBoy(x, y);
    }

    if (character === "girl") {
        drawGirl(x, y);
    }

    if (character === "couple") {
        drawBoy(x - 25, y);
        drawGirl(x + 25, y);
    }

    // พื้นบริเวณริมฝั่ง
    ctx.fillStyle = "#1c2335";

    ctx.beginPath();
    ctx.ellipse(x, y + 15, 55, 15, 0, 0, Math.PI * 2);
    ctx.fill();
}

// ---------------- KRATHONG ----------------

function drawKrathong(x, y, emoji, scale = 1) {
    ctx.save();

    ctx.textAlign = "center";

    ctx.font = `${25 * scale}px serif`;

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ffd66d";

    ctx.fillText(emoji, x, y);

    ctx.shadowBlur = 0;

    // เงาสะท้อน
    ctx.globalAlpha = .2;
    ctx.fillText(emoji, x, y + 18);

    ctx.restore();
}

function createKrathong() {
    floatingKrathongs.push({
        x: W * .22,
        y: H * .73,
        emoji: krathong,
        speed: .4 + Math.random() * .7,
        scale: .8 + Math.random() * .5,
        phase: Math.random() * 10
    });
}

function drawKrathongs() {
    floatingKrathongs.forEach((k, index) => {
        k.x += k.speed;
        k.phase += .03;

        k.y += Math.sin(k.phase) * .25;

        drawKrathong(
            k.x,
            k.y,
            k.emoji,
            k.scale
        );

        if (k.x > W + 60) {
            floatingKrathongs.splice(index, 1);
        }
    });
}

// ---------------- LIGHT PARTICLES ----------------

function createParticles() {
    for (let i = 0; i < 50; i++) {
        particles.push({
            x: Math.random() * W,
            y: H * .55 + Math.random() * H * .4,
            size: Math.random() * 3 + 1,
            speed: Math.random() * .6 + .1,
            alpha: Math.random()
        });
    }
}

function drawParticles() {
    particles.forEach(p => {
        p.y -= p.speed;
        p.alpha += (Math.random() - .5) * .1;

        p.alpha = Math.max(.1, Math.min(1, p.alpha));

        if (p.y < H * .3) {
            p.y = H * .95;
        }

        ctx.fillStyle = `rgba(255,210,100,${p.alpha})`;

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ffca58";

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.shadowBlur = 0;
}

// ---------------- FIREWORK ----------------

function createFirework(x, y) {
    let colors = [
        "#ffdf75",
        "#ff85ad",
        "#83f5ff",
        "#a4ff90",
        "#ffffff"
    ];

    for (let i = 0; i < 80; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 4 + 1;

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 3 + 1,
            speed: 0,
            alpha: 1,
            life: 70,
            color: colors[Math.floor(Math.random() * colors.length)],
            firework: true
        });
    }
}

// ---------------- ASCII EFFECT ----------------

function drawASCII() {
    ctx.font = `${Math.max(8, 10 * density)}px monospace`;

    let count = Math.floor(W / (12 / density));

    for (let i = 0; i < count; i++) {
        let x = Math.random() * W;
        let y = H * .58 + Math.random() * H * .4;

        ctx.fillStyle = `rgba(100,180,255,${Math.random() * .25})`;

        ctx.fillText(
            symbols[Math.floor(Math.random() * symbols.length)],
            x,
            y
        );
    }
}

// ---------------- ANIMATION ----------------

function animate() {
    background();

    drawStars();
    drawMoon();
    drawTemple();
    drawWater();
    drawCharacters();
    drawKrathongs();
    drawParticles();
    drawASCII();

    requestAnimationFrame(animate);
}

resize();
createParticles();
animate();

// ---------------- CONTROLS ----------------

document.getElementById("character").onchange = function() {
    character = this.value;
};

document.getElementById("krathong").onchange = function() {
    krathong = this.value;
};

document.getElementById("floatBtn").onclick = function() {
    createKrathong();
};

document.getElementById("fireworkBtn").onclick = function() {
    createFirework(
        Math.random() * W,
        Math.random() * H * .45
    );
};

document.getElementById("densityBtn").onclick = function() {
    density++;

    if (density > 3) density = 1;

    this.textContent = [
        "✨ ความละเอียด: เบา",
        "✨ ความละเอียด: ปานกลาง",
        "✨ ความละเอียด: หนาแน่น"
    ][density - 1];
};

document.getElementById("hideBtn").onclick = function() {
    document.getElementById("panel").classList.toggle("hidden");
};

// ---------------- MUSIC ----------------

document.getElementById("uploadBtn").onclick = function() {
    document.getElementById("musicFile").click();
};

document.getElementById("musicFile").onchange = function(event) {
    const file = event.target.files[0];

    if (!file) return;

    audio.src = URL.createObjectURL(file);
    audio.load();

    document.getElementById("musicName").textContent = file.name;

    audio.play()
        .then(() => {
            playing = true;
            document.getElementById("musicBtn").textContent = "⏸ หยุดเพลง";
        })
        .catch(() => {
            playing = false;
            document.getElementById("musicBtn").textContent = "🎵 เล่นเพลง";
        });
};

document.getElementById("musicBtn").onclick = function() {
    if (!audio.src) {
        document.getElementById("musicFile").click();
        return;
    }

    if (playing) {
        audio.pause();
        playing = false;
        this.textContent = "🎵 เล่นเพลง";
    } else {
        audio.play();
        playing = true;
        this.textContent = "⏸ หยุดเพลง";
    }
};

document.getElementById("soundBtn").onclick = function() {
    soundEnabled = !soundEnabled;

    this.textContent = soundEnabled
        ? "🔊 เสียงเปิด"
        : "🔇 เสียงปิด";
};

// ---------------- CLICK WATER ----------------

canvas.addEventListener("click", function(event) {
    let x = event.clientX;
    let y = event.clientY;

    if (y > H * .55) {
        floatingKrathongs.push({
            x,
            y,
            emoji: krathong,
            speed: .5 + Math.random(),
            scale: 1,
            phase: 0
        });
    } else {
        createFirework(x, y);
    }
});

</script>
</body>
</html>
