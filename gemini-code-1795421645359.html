<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loy Krathong Magic | โรงเรียนสมบูรณ์เลิศวิทยา</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020716;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    canvas#scene {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* แถบส่วนหัวด้านบน */
    .header {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 17px;
      border: 1px solid #e9c76b66;
      border-radius: 18px;
      background: #09152bd9;
      backdrop-filter: blur(12px);
      z-index: 3;
      max-width: 95%;
    }

    /* บังคับสัดส่วนโลโก้เป็น 1:1 เสมอ และคลิกเพื่อแก้ไขได้ */
    .logo {
      width: 56px;
      height: 56px;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #e9c76b88;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .logo:hover {
      transform: scale(1.06);
      box-shadow: 0 0 14px #ffe49b88;
    }

    .logo.square-1-1 {
      border-radius: 12px;
    }

    .school {
      font-weight: 700;
      color: #ffe49b;
      font-size: clamp(15px, 2.1vw, 25px);
      white-space: nowrap;
    }

    .subtitle {
      font-size: 10px;
      letter-spacing: 2px;
      color: #cde7ff;
      margin-top: 4px;
    }

    /* แผงปุ่มควบคุมด้านล่าง */
    .panel {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(96%, 1120px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border: 1px solid #e9c76b44;
      border-radius: 18px;
      background: #101b30c9;
      backdrop-filter: blur(14px);
      z-index: 3;
    }

    button, select {
      background: #172640;
      color: #f6f3e9;
      border: 1px solid #d5b65c66;
      border-radius: 11px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #314766;
    }

    select option {
      background: #172640;
    }

    #trackName {
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: #ffe18a;
    }

    .hidden {
      display: none !important;
    }

    /* หน้าต่าง Modal สำหรับปรับแต่งโลโก้ 1:1 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 7, 22, 0.78);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }

    .modal-box {
      width: min(95vw, 390px);
      background: #0d1a33;
      border: 1px solid #e9c76b88;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      text-align: center;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffe49b;
      margin: 0 0 4px;
    }

    .modal-desc {
      font-size: 12px;
      color: #cde7ff;
      margin: 0 0 14px;
    }

    /* พื้นที่พรีวิวกรอบ 1:1 */
    .preview-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 14px;
      border: 2px dashed #e9c76b;
      border-radius: 50%;
      overflow: hidden;
      cursor: grab;
      background-image:
        linear-gradient(45deg, #1b2b4a 25%, transparent 25%),
        linear-gradient(-45deg, #1b2b4a 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1b2b4a 75%),
        linear-gradient(-45deg, transparent 75%, #1b2b4a 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      touch-action: none;
    }

    .preview-wrap:active {
      cursor: grabbing;
    }

    .preview-wrap.square-1-1 {
      border-radius: 16px;
    }

    #logoCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      text-align: left;
      font-size: 12px;
      color: #e6eefc;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .control-row input[type="range"] {
      flex: 1;
      accent-color: #e9c76b;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .btn-primary {
      background: #d5a93e;
      color: #09152b;
      font-weight: 700;
      border-color: #ffe49b;
    }

    .btn-primary:hover {
      background: #f0c456;
    }

    @media (max-width: 600px) {
      .logo {
        width: 42px;
        height: 42px;
      }
      .header {
        gap: 8px;
        padding: 8px 11px;
        top: 8px;
      }
      .subtitle {
        font-size: 8px;
      }
      .panel {
        bottom: 7px;
        gap: 5px;
        padding: 8px;
      }
      button, select {
        font-size: 11px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>

  <canvas id="scene"></canvas>

  <!-- ส่วนหัวแสดงโลโก้ 1:1 และชื่อโรงเรียน -->
  <div class="header">
    <img id="schoolLogo" class="logo" title="คลิกเพื่อปรับแต่งโลโก้ 1:1" alt="ตราโรงเรียน">
    <div>
      <div class="school">โรงเรียนสมบูรณ์เลิศวิทยา</div>
      <div class="subtitle">LOY KRATHONG FESTIVAL</div>
    </div>
  </div>

  <!-- แผงควบคุมหลักด้านล่าง -->
  <div class="panel" id="panel">
    <select id="character">
      <option value="boy">👦 เด็กผู้ชาย</option>
      <option value="girl">👧 เด็กผู้หญิง</option>
      <option value="pair">👦👧 เด็กคู่</option>
    </select>

    <select id="krathong">
      <option value="🪷">🪷 กระทงดอกบัว</option>
      <option value="🌸">🌸 กระทงดอกไม้</option>
      <option value="🌼">🌼 กระทงดาวเรือง</option>
      <option value="🕯️">🕯️ กระทงเทียน</option>
      <option value="🍃">🍃 กระทงใบตอง</option>
      <option value="✨">✨ กระทงแฟนตาซี</option>
    </select>

    <button id="float">🪷 ปล่อยกระทง</button>
    <button id="fireworks">🎆 จุดพลุ</button>
    <button id="music">🎵 เล่นเพลง</button>
    <span id="trackName">ยังไม่ได้เลือกเพลง</span>
    <button id="upload">📁 อัปโหลดเพลง</button>
    <input id="file" type="file" accept="audio/*" hidden>
    <button id="volume">🔊 เสียงเปิด</button>
    <button id="density">✨ ความหนาแน่น: ปกติ</button>
    <button id="openLogoModal">🖼️ โลโก้ 1:1</button>
    <button id="fullscreen">⛶ เต็มหน้าจอ</button>
    <button id="hide">👁 ซ่อนเมนู</button>
  </div>

  <!-- หน้าต่างปรับแต่งโลโก้ขนาด 1:1 -->
  <div class="modal-backdrop hidden" id="logoModal">
    <div class="modal-box">
      <h3 class="modal-title">🖼️ ปรับแต่งโลโก้ขนาด 1:1</h3>
      <p class="modal-desc">ลากรูปภาพในกรอบเพื่อจัดตำแหน่ง หรือเลื่อนแถบซูมด้านล่าง</p>

      <div class="preview-wrap" id="previewWrap">
        <canvas id="logoCanvas" width="400" height="400"></canvas>
      </div>

      <div class="control-group">
        <div class="control-row">
          <button type="button" id="chooseLogoFile" style="width: 100%;">📂 เลือกรูปโลโก้ใหม่จากเครื่อง</button>
          <input type="file" id="logoFileInput" accept="image/*" hidden>
        </div>

        <div class="control-row">
          <span>🔍 ซูม:</span>
          <input type="range" id="logoZoom" min="0.3" max="3" step="0.02" value="1">
          <span id="zoomLabel" style="min-width: 38px; text-align: right;">100%</span>
        </div>

        <div class="control-row">
          <span>⬜ รูปทรง 1:1:</span>
          <select id="logoShape" style="flex: 1;">
            <option value="circle">วงกลม (Circle 1:1)</option>
            <option value="square">สี่เหลี่ยมจัตุรัสมน (Square 1:1)</option>
          </select>
        </div>

        <div class="control-row">
          <span>🎨 พื้นหลังโลโก้:</span>
          <select id="logoBg" style="flex: 1;">
            <option value="#ffffff">สีขาว (#FFFFFF)</option>
            <option value="#ffe49b">สีทองอ่อน (#FFE49B)</option>
            <option value="#09152b">สีน้ำเงินเข้ม (#09152B)</option>
            <option value="transparent">โปร่งใส (Transparent)</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-primary" id="saveLogoBtn">✅ บันทึกโลโก้ 1:1</button>
        <button type="button" id="resetLogoBtn">↺ ค่าเริ่มต้น</button>
        <button type="button" id="closeLogoModal">✕ ปิด</button>
      </div>
    </div>
  </div>

    const logoModal = document.getElementById('logoModal');
    const previewWrap = document.getElementById('previewWrap');
    const logoCanvas = document.getElementById('logoCanvas');
    const logoCtx = logoCanvas.getContext('2d');
    const logoFileInput = document.getElementById('logoFileInput');
    const logoZoom = document.getElementById('logoZoom');
    const zoomLabel = document.getElementById('zoomLabel');
    const logoShape = document.getElementById('logoShape');
    const logoBg = document.getElementById('logoBg');

    // สถานะการปรับแต่งโลโก้
    let logoImg = new Image();
    let logoState = {
      zoom: 1,
      offsetX: 0,
      offsetY: 0,
      shape: 'circle',
      bg: '#ffffff'
    };

    // โหลดโลโก้ที่เคยบันทึกไว้ (ถ้ามี)
    function loadSavedLogo() {
      const savedData = localStorage.getItem('slw_krathong_logo_1_1');
      const savedShape = localStorage.getItem('slw_krathong_logo_shape') || 'circle';
      schoolLogoEl.src = savedData || DEFAULT_LOGO;
      logoShape.value = savedShape;
      applyShapeClass(savedShape);
      setEditorImage(schoolLogoEl.src, false);
    }

    function applyShapeClass(shape) {
      if (shape === 'square') {
        schoolLogoEl.classList.add('square-1-1');
        previewWrap.classList.add('square-1-1');
      } else {
        schoolLogoEl.classList.remove('square-1-1');
        previewWrap.classList.remove('square-1-1');
      }
    }

    // ตั้งค่ารูปภาพเข้าสู่ตัวแก้ไข 1:1
    function setEditorImage(src, resetTransform = true) {
      logoImg = new Image();
      logoImg.onload = () => {
        if (resetTransform) {
          logoState.zoom = 1;
          logoState.offsetX = 0;
          logoState.offsetY = 0;
          logoZoom.value = 1;
          zoomLabel.textContent = '100%';
        }
        renderLogoPreview();
      };
      logoImg.src = src;
    }

    // วาดภาพลงบนกรอบ 1:1 (400x400px)
    function renderLogoPreview() {
      const size = logoCanvas.width; // 400
      logoCtx.clearRect(0, 0, size, size);

      // เติมสีพื้นหลัง
      if (logoState.bg !== 'transparent') {
        logoCtx.fillStyle = logoState.bg;
        logoCtx.fillRect(0, 0, size, size);
      }

      if (!logoImg.width || !logoImg.height) return;

      // คำนวณสัดส่วนเริ่มต้นให้พอดีกรอบ 1:1
      const baseScale = Math.min(size / logoImg.width, size / logoImg.height);
      const drawW = logoImg.width * baseScale * logoState.zoom;
      const drawH = logoImg.height * baseScale * logoState.zoom;
      const drawX = (size - drawW) / 2 + logoState.offsetX;
      const drawY = (size - drawH) / 2 + logoState.offsetY;

      logoCtx.drawImage(logoImg, drawX, drawY, drawW, drawH);
    }

    // เปิด/ปิดหน้าต่างปรับแต่งโลโก้
    function openLogoEditor() {
      setEditorImage(schoolLogoEl.src, true);
      logoModal.classList.remove('hidden');
    }

    schoolLogoEl.onclick = openLogoEditor;
    document.getElementById('openLogoModal').onclick = openLogoEditor;
    document.getElementById('closeLogoModal').onclick = () => logoModal.classList.add('hidden');

    // อัปโหลดไฟล์รูปโลโก้ใหม่
    document.getElementById('chooseLogoFile').onclick = () => logoFileInput.click();
    logoFileInput.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => setEditorImage(ev.target.result, true);
      reader.readAsDataURL(file);
    };

    // ปรับซูม รูปทรง และพื้นหลัง
    logoZoom.oninput = e => {
      logoState.zoom = parseFloat(e.target.value);
      zoomLabel.textContent = `${Math.round(logoState.zoom * 100)}%`;
      renderLogoPreview();
    };

    logoShape.onchange = e => {
      logoState.shape = e.target.value;
      applyShapeClass(logoState.shape);
    };

    logoBg.onchange = e => {
      logoState.bg = e.target.value;
      renderLogoPreview();
    };

    // ลากจัดตำแหน่งรูปภาพในกรอบ 1:1 (รองรับทั้งเมาส์และหน้าจอสัมผัส)
    let isDraggingLogo = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function startDrag(clientX, clientY) {
      isDraggingLogo = true;
      dragStartX = clientX;
      dragStartY = clientY;
    }

    function moveDrag(clientX, clientY) {
      if (!isDraggingLogo) return;
      // คูณอัตราส่วนความละเอียด Canvas (400px) เทียบกับขนาดแสดงผลจริง (220px)
      const ratio = logoCanvas.width / previewWrap.clientWidth;
      logoState.offsetX += (clientX - dragStartX) * ratio;
      logoState.offsetY += (clientY - dragStartY) * ratio;
      dragStartX = clientX;
      dragStartY = clientY;
      renderLogoPreview();
    }

    previewWrap.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', () => { isDraggingLogo = false; });

    previewWrap.addEventListener('touchstart', e => {
      if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      if (isDraggingLogo && e.touches.length === 1) {
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
    window.addEventListener('touchend', () => { isDraggingLogo = false; });

    // บันทึกโลโก้ขนาด 1:1 ลงหน้าเว็บและ localStorage
    document.getElementById('saveLogoBtn').onclick = () => {
      const exportedDataUrl = logoCanvas.toDataURL('image/png');
      schoolLogoEl.src = exportedDataUrl;
      applyShapeClass(logoShape.value);
      try {
        localStorage.setItem('slw_krathong_logo_1_1', exportedDataUrl);
        localStorage.setItem('slw_krathong_logo_shape', logoShape.value);
      } catch (err) {
        // กรณีไฟล์ใหญ่เกินโควต้า localStorage จะยังคงแสดงผลในหน้าปัจจุบันได้ตามปกติ
      }
      logoModal.classList.add('hidden');
    };

    // รีเซ็ตกลับเป็นโลโก้เดิม
    document.getElementById('resetLogoBtn').onclick = () => {
      localStorage.removeItem('slw_krathong_logo_1_1');
      localStorage.removeItem('slw_krathong_logo_shape');
      logoShape.value = 'circle';
      logoBg.value = '#ffffff';
      logoState.shape = 'circle';
      logoState.bg = '#ffffff';
      applyShapeClass('circle');
      schoolLogoEl.src = DEFAULT_LOGO;
      setEditorImage(DEFAULT_LOGO, true);
    };

    loadSavedLogo();

    // --- ส่วนแอนิเมชันฉากลอยกระทง ---
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    let W, H, stars = [], snow = [], krathongs = [], particles = [];
    let selectedChar = 'boy', selectedKrathong = '🪷', density = 1, soundOn = true;
    let audio = new Audio();
    audio.loop = true;
    audio.volume = 0.5;
    let playing = false;

    function resize() {
      W = canvas.width = innerWidth;
      H = canvas.height = innerHeight;
      initStars();
      initSnow();
    }
    addEventListener('resize', resize);

    function initStars() {
      stars = Array.from({ length: 150 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H * 0.55,
        a: Math.random()
      }));
    }

    function initSnow() {
      snow = Array.from({ length: Math.floor((W * H) / 6000 * density) }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() * 1.8 + 0.5,
        v: Math.random() * 1.2 + 0.3
      }));
    }

    function bg() {
      let g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#030615');
      g.addColorStop(0.55, '#101b37');
      g.addColorStop(1, '#090d1b');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function drawStars() {
      stars.forEach(s => {
        s.a += (Math.random() - 0.5) * 0.07;
        s.a = Math.max(0.15, Math.min(1, s.a));
        ctx.fillStyle = `rgba(255,245,210,${s.a})`;
        ctx.font = '12px serif';
        ctx.fillText(Math.random() > 0.7 ? '✦' : '.', s.x, s.y);
      });
    }

    function moon() {
      let x = W * 0.78, y = H * 0.19, r = Math.min(W, H) * 0.06;
      ctx.save();
      ctx.shadowBlur = 35;
      ctx.shadowColor = '#ffe9a3';
      ctx.fillStyle = '#fff1bd';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function hills() {
      ctx.fillStyle = '#111b30';
      ctx.beginPath();
      ctx.moveTo(0, H * 0.53);
      for (let x = 0; x <= W; x += 45) {
        ctx.lineTo(x, H * 0.52 + Math.sin(x * 0.013) * 32);
      }
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.fill();
    }

    function temple() {
      let x = W * 0.53, y = H * 0.57;
      ctx.textAlign = 'center';
      ctx.font = `${Math.max(10, 12 * density)}px monospace`;
      for (let row = 0; row < 13; row++) {
        let yy = y - row * 13, wide = (13 - row) * 11;
        for (let dx = -wide; dx < wide; dx += 13) {
          ctx.fillStyle = row % 3 === 0 ? '#e6ba67' : '#c68c50';
          if (Math.random() > 0.35) {
            ctx.fillText(row % 2 ? '▲' : '/', x + dx, yy);
          }
        }
      }
      ctx.fillStyle = '#ffe17e';
      ctx.font = '22px serif';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ffdb75';
      ctx.fillText('▲', x, y - 185);
      ctx.shadowBlur = 0;
    }

    function water() {
      let y = H * 0.59, g = ctx.createLinearGradient(0, y, 0, H);
      g.addColorStop(0, '#14375c');
      g.addColorStop(1, '#030c20');
      ctx.fillStyle = g;
      ctx.fillRect(0, y, W, H - y);
      ctx.font = `${Math.max(9, 12 * density)}px monospace`;
      for (let yy = y + 12; yy < H; yy += 18) {
        for (let x = 0; x < W; x += 24) {
          ctx.fillStyle = Math.random() > 0.7 ? 'rgba(255,221,143,.35)' : 'rgba(98,180,236,.18)';
          ctx.fillText(['~', '≈', '﹏', '∿'][Math.floor(Math.random() * 4)], x + Math.sin(x * 0.02 + yy * 0.01) * 4, yy);
        }
      }
    }

    function drawChar(x, y, type) {
      ctx.font = '40px serif';
      ctx.textAlign = 'center';
      ctx.fillText(type === 'boy' ? '👦' : '👧', x, y);
    }

    function characters() {
      let y = H * 0.67, x = W * 0.19;
      if (selectedChar === 'boy') drawChar(x, y, 'boy');
      else if (selectedChar === 'girl') drawChar(x, y, 'girl');
      else {
        drawChar(x - 27, y, 'boy');
        drawChar(x + 27, y, 'girl');
      }
    }

    function drawK(k) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = `${28 * k.scale}px serif`;
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ffd870';
      ctx.fillText(k.emoji, k.x, k.y);
      ctx.restore();
    }

    function spawnKrathong(x = W * 0.2, y = H * 0.76) {
      krathongs.push({
        x, y,
        emoji: selectedKrathong,
        speed: 0.25 + Math.random() * 0.5,
        phase: Math.random() * 6,
        scale: 0.8 + Math.random() * 0.45
      });
    }

    function floaters() {
      for (let i = krathongs.length - 1; i >= 0; i--) {
        let k = krathongs[i];
        k.x += k.speed;
        k.phase += 0.03;
        k.y += Math.sin(k.phase) * 0.22;
        drawK(k);
        if (k.x > W + 60) krathongs.splice(i, 1);
      }
    }

    function firework(x = Math.random() * W, y = Math.random() * H * 0.45) {
      const colors = ['#ffdf77', '#ff89ba', '#82f6ff', '#a5ff98', '#fff'];
      for (let i = 0; i < 65; i++) {
        let a = Math.random() * Math.PI * 2, v = Math.random() * 3.8 + 1;
        particles.push({
          x, y,
          vx: Math.cos(a) * v,
          vy: Math.sin(a) * v,
          life: 50 + Math.random() * 25,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function effects() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.035;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 70);
        ctx.fillText('✦', p.x, p.y);
        ctx.globalAlpha = 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
      snow.forEach(s => {
        s.y += s.v;
        s.x += Math.sin(s.y * 0.012) * 0.25;
        if (s.y > H) {
          s.y = 0;
          s.x = Math.random() * W;
        }
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.font = `${s.s + 7}px monospace`;
        ctx.fillText(Math.random() > 0.5 ? '❄' : '.', s.x, s.y);
      });
    }

    function animate() {
      bg();
      drawStars();
      moon();
      hills();
      temple();
      water();
      characters();
      floaters();
      effects();
      requestAnimationFrame(animate);
    }

    resize();
    animate();

    document.getElementById('character').onchange = e => selectedChar = e.target.value;
    document.getElementById('krathong').onchange = e => selectedKrathong = e.target.value;
    document.getElementById('float').onclick = () => spawnKrathong();
    document.getElementById('fireworks').onclick = () => firework();

    canvas.addEventListener('click', e => {
      if (e.clientY > H * 0.58) spawnKrathong(e.clientX, e.clientY);
      else firework(e.clientX, e.clientY);
    });

    document.getElementById('upload').onclick = () => document.getElementById('file').click();
    document.getElementById('file').onchange = e => {
      let f = e.target.files[0];
      if (!f) return;
      audio.src = URL.createObjectURL(f);
      document.getElementById('trackName').textContent = f.name;
      audio.play().then(() => {
        playing = true;
        document.getElementById('music').textContent = '⏸ หยุดเพลง';
      }).catch(() => {
        playing = false;
        document.getElementById('music').textContent = '🎵 เล่นเพลง';
      });
    };

    document.getElementById('music').onclick = () => {
      if (!audio.src) {
        document.getElementById('file').click();
        return;
      }
      if (playing) {
        audio.pause();
        playing = false;
        document.getElementById('music').textContent = '🎵 เล่นเพลง';
      } else {
        audio.play();
        playing = true;
        document.getElementById('music').textContent = '⏸ หยุดเพลง';
      }
    };

    document.getElementById('volume').onclick = () => {
      soundOn = !soundOn;
      audio.muted = !soundOn;
      document.getElementById('volume').textContent = soundOn ? '🔊 เสียงเปิด' : '🔇 เสียงปิด';
    };

    const densityBtn = document.getElementById('density');
    densityBtn.onclick = () => {
      density = density % 3 + 1;
      densityBtn.textContent = ['✨ ความหนาแน่น: เบา', '✨ ความหนาแน่น: ปานกลาง', '✨ ความหนาแน่น: แน่น'][density - 1];
      initSnow();
    };

    document.getElementById('fullscreen').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    };

    document.getElementById('hide').onclick = () => document.getElementById('panel').classList.toggle('hidden');
  </script>
</body>
</html>
